[project]
name = "genai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sittal Basyal", email = "bashyalshittal@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arxiv==3.0.0",
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "docling-parse>=7.21.0",
    "docling-slim[format-pdf-docling]>=2.130.0",
    "httpx2>=2.13.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-docling>=3.0.0",
    "langchain-google>=0.1.1",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-mistralai>=1.1.6",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "loadenv>=0.1.1",
    "pip>=26.2.1",
    "pydantic>=2.14.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "wikipedia>=1.4.0",
]

[project.scripts]
genai = "genai:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
